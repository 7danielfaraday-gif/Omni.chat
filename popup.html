<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121214;
      color: #e1e1e6;
      margin: 0;
      padding: 16px;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      color: #00e676;
      text-align: center;
    }
    .card {
      background-color: #202024;
      border: 1px solid #29292e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    label {
      font-size: 12px;
      color: #a8a8b3;
      display: block;
      margin-bottom: 4px;
    }
    select, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      box-sizing: border-box;
    }
    select {
      background-color: #121214;
      color: #fff;
      border: 1px solid #323238;
      margin-bottom: 12px;
    }
    button {
      background: linear-gradient(90deg, #00e676, #00b0ff);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button.stop {
      background: #e53935;
      color: #fff;
      margin-top: 8px;
    }
    .status {
      font-size: 12px;
      text-align: center;
      margin-top: 10px;
      color: #00e676;
      min-height: 18px;
    }
    .progress {
      font-size: 11px;
      color: #8d8d99;
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h2>🚀 RPA Longa Sessão & Cookies</h2>
  <div class="card">
    <label for="personaSelect">Escolha a Persona:</label>
    <select id="personaSelect">
      <option value="aleatorio">🎲 Aleatório (Recomendado)</option>
      <option value="leitor_noticias">📰 Leitor de Notícias</option>
      <option value="entusiasta_tech">💻 Entusiasta Tech</option>
      <option value="comprador_casual">🛒 Comprador Casual</option>
      <option value="anunciante_digital">📢 Anunciante Digital</option>
      <option value="cozinheiro">🍳 Cozinheiro & Saúde</option>
      <option value="navegador_geral">🌐 Navegador Geral</option>
    </select>

    <button id="btnStart">▶ Iniciar Sessão Longa de RPA</button>
    <button id="btnStop" class="stop" style="display:none;">⏹ Parar RPA</button>
  </div>

  <div id="statusText" class="status">Pronto para iniciar.</div>
  <div id="progressText" class="progress"></div>

  <script src="popup.js"></script>
</body>
</html>
